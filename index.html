<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Alerta do Rio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --ok:#2e7d32; --yellow:#f9a825; --orange:#ef6c00; --text:#fff;
      --center-top:30%;
      --bg-bright:1.12;
    }
    body{ margin:0; background:#0b0f14; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; color:var(--text); }
    .stage{ min-height:100vh; display:grid; place-items:center; padding:16px; }
    .app{
      width:390px; height:780px; position:relative; overflow:hidden; border-radius:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25); background:#000;
    }
    @media (max-width:480px){ .app{ width:100vw; height:100vh; border-radius:0; box-shadow:none; } }

    .bg{ position:absolute; inset:0; background:#000 center/cover no-repeat;
         filter: brightness(var(--bg-bright)) contrast(1.05) saturate(1.06); }
    .scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.35)); }

    /* TOPO: dois cards lado a lado e sempre dentro da tela */
    .hud{ position:absolute; left:12px; right:12px; top:12px; display:flex; }
    .widgets{
      display:grid; grid-template-columns: repeat(2, minmax(0,1fr));
      gap:8px; width:100%; box-sizing:border-box;
    }
    .mini{ min-width:auto; padding:10px 12px; border-radius:12px;
           backdrop-filter:blur(8px); background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.22));
           border:1px solid rgba(255,255,255,.35); box-shadow:0 6px 24px rgba(0,0,0,.18); }
    .mini .t{ font-size:12px; font-weight:700; margin:0 0 2px; color:#0f1720; }
    .mini .s{ font-size:12px; color:#2d3a45; white-space:pre-line; }

    @media (max-width:360px){
      .widgets{ grid-template-columns: 1fr; }
    }

    /* Texto central (sem caixa) */
    .center{
      position:absolute; left:50%; top:var(--center-top); transform:translate(-50%,-50%);
      width:100%; display:flex; justify-content:center; padding:0 16px; pointer-events:none; z-index:3;
    }
    .river{ text-align:center; --shadow:0 2px 6px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.6); }
    .icon{ font-size:48px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .label{ margin-top:6px; font-size:14px; color:#e9f1fb; text-shadow:var(--shadow); letter-spacing:.2px; }
    .status{ margin-top:2px; font-size:24px; font-weight:900; text-shadow:var(--shadow); }
    .status.ok{ color:var(--ok); } .status.yellow{ color:var(--yellow); } .status.orange{ color:var(--orange); }
    .msg{ margin-top:6px; font-size:14px; color:#f0f6ff; opacity:.95; text-shadow:var(--shadow); }

    .bottom{
      position:absolute; inset:auto 16px 14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; z-index:4;
    }
    .btn{ border:0; padding:10px 14px; border-radius:12px; background:#1565c0; color:#fff; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25);}
    .btn:active{ transform:translateY(1px); }
    .ts{ font-size:11px; color:#e7eef6; text-shadow:0 1px 2px rgba(0,0,0,.55); }

    #toast{ position:absolute; left:50%; transform:translateX(-50%); bottom:70px; background:#ffebee; color:#b71c1c;
            border:1px solid #ffcdd2; padding:8px 10px; border-radius:10px; font-size:12px; display:none; box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:5; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="app">
      <div class="bg" id="bg"></div>
      <div class="scrim"></div>

      <div class="hud">
        <div class="widgets">
          <div class="mini">
            <div class="t">☔ Chuva nas últimas 24h</div>
            <div class="s"><span id="rainVal">—</span> mm</div>
          </div>
          <div class="mini">
            <div class="t">⛰️ Risco de deslizamento</div>
            <div class="s" id="landText">Carregando…</div>
          </div>
        </div>
      </div>

      <div class="center">
        <div class="river" id="riverCard">
          <div class="icon" id="riverIcon">💧</div>
          <div class="label">Nível do rio</div>
          <div class="status ok" id="riverStatus">Normal</div>
          <div class="msg" id="riverMsg">Tudo tranquilo por enquanto.</div>
        </div>
      </div>

      <div class="bottom">
        <button class="btn" id="btnSwap">Forçar troca</button>
        <div class="ts" id="ts">Atualizado em: —</div>
      </div>

      <div id="toast"></div>
    </div>
  </div>

<script defer>
(function(){
  // ===== CONFIGURAÇÃO APAC =====
  // Troque pela URL da camada de chuva (termina em /FeatureServer/0)
  const SERVICE_URL     = 'https://geoportal.apac.pe.gov.br/server/rest/services/Hosted/EXEMPLO_CAMADA/FeatureServer/0';
  const FIELD_MUNICIPIO = 'municipio';   // ajuste pro nome exato do campo do município (ex.: MUNICIPIO)
  const APAC_MUNICIPIO  = 'RECIFE';      // município desejado
  const UPDATE_MIN      = 5;             // frequência de atualização (min)
  const USE_PROXY       = false;         // se der CORS, crie /api/apac-rain.js e troque para true

  // ===== IMAGENS DA JOANA (somente .jpg) =====
  const BG_IMAGES = {
    none:   'joana_normal.jpg',
    yellow: 'joana_alerta_amarelo.jpg',
    orange: 'joana_alerta_laranja.jpg'
  };

  // ===== CONFIG SIMULAÇÃO =====
  const TICK_SECONDS = 30;               // alterna o nível do rio (fotos/olhos)
  const bg   = document.getElementById('bg');
  const toast= document.getElementById('toast');

  function showToast(msg){ toast.textContent=msg; toast.style.display='block'; setTimeout(()=>toast.style.display='none',2600); }
  function setBackground(level){
    const src = BG_IMAGES[level] || BG_IMAGES.none;
    bg.style.backgroundImage = `url("${src}?v=${Date.now()}")`; // cache-buster
  }

  // UI refs
  const riverIcon  = document.getElementById('riverIcon');
  const riverStatus= document.getElementById('riverStatus');
  const riverMsg   = document.getElementById('riverMsg');
  const rainVal    = document.getElementById('rainVal');
  const landText   = document.getElementById('landText');
  const ts         = document.getElementById('ts');
  const btnSwap    = document.getElementById('btnSwap');

  let state = { river_level:'none', rain_mm_24h:NaN, landslide_risk:'none', ts:new Date() };

  function setState(s){
    state = s;
    setBackground(state.river_level);

    const map = {
      none:{icon:'💧',label:'Normal',cls:'ok',msg:'Tudo tranquilo por enquanto.'},
      yellow:{icon:'⚠️',label:'ALERTA AMARELO',cls:'yellow',msg:'Atenção! Nível elevado. Fique em alerta.'},
      orange:{icon:'⚠️',label:'ALERTA LARANJA',cls:'orange',msg:'Risco moderado/alto. Evite áreas sujeitas a alagamento.'}
    };
    const m = map[state.river_level]||map.none;

    riverIcon.textContent = m.icon;
    riverStatus.className = 'status ' + m.cls;
    riverStatus.textContent = m.label;
    riverMsg.textContent = m.msg;

    if (!Number.isNaN(state.rain_mm_24h)) {
      rainVal.textContent = Number(state.rain_mm_24h).toFixed(1);
    }
    landText.textContent = {none:'Nenhum',yellow:'AMARELO — monitore encostas.',orange:'LARANJA — evite áreas de risco.'}[state.landslide_risk]||'Nenhum';

    ts.textContent = 'Atualizado em: ' + new Date(state.ts).toLocaleString('pt-BR');
  }

  const levels=['none','yellow','orange'];
  const nextLevel = l => levels[(levels.indexOf(l)+1)%levels.length];

  // Simula só o nível do rio (fotos/olhos)
  function randomSim(){
    const next = nextLevel(state.river_level);
    setState({
      river_level: next,
      rain_mm_24h: state.rain_mm_24h,
      landslide_risk: state.landslide_risk,
      ts: new Date()
    });
  }

  // ===== Integração APAC (ArcGIS FeatureServer) =====
  async function getApacRain({ municipio = APAC_MUNICIPIO, limit = 1 } = {}) {
    const params = new URLSearchParams({
      where: `UPPER(${FIELD_MUNICIPIO})='${(municipio||'').toUpperCase()}'`,
      outFields: '*',
      orderByFields: 'ultima_atualizacao DESC',
      resultRecordCount: String(limit),
      returnGeometry: 'false',
      f: 'json'
    });
    const base = USE_PROXY ? '/api/apac-rain' : `${SERVICE_URL}/query`;
    const url = `${base}?${params.toString()}`;

    const res = await fetch(url);
    if (!res.ok) throw new Error('Falha ao consultar a APAC');
    const data = await res.json();
    if (!data.features || !data.features.length) throw new Error('Sem dados para este município');
    return data.features.map(f => f.attributes);
  }

  async function atualizarChuva() {
    try {
      const [row] = await getApacRain({ municipio: APAC_MUNICIPIO, limit: 1 });
      const mm =
        row.mm_24h ?? row.acum_24h ?? row.acumulado_24h ?? row.prec24h ?? row.valor ?? 0;

      let land = 'none';
      if (mm > 120) land = 'orange';
      else if (mm > 80) land = 'yellow';

      const tsRow = row.ultima_atualizacao || Date.now();

      setState({
        river_level: state.river_level,
        rain_mm_24h: Number(mm),
        landslide_risk: land,
        ts: tsRow
      });
    } catch (e) {
      console.warn(e);
      showToast('Não consegui ler a chuva da APAC agora.');
    }
  }

  // Inicial
  setState(state);
  atualizarChuva();
  setInterval(atualizarChuva, 5*60*1000);
  randomSim();
  setInterval(randomSim, TICK_SECONDS*1000);
  btnSwap.addEventListener('click', randomSim);
})();
</script>
</body>
</html>
