<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Alerta do Rio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --ok:#2e7d32; --yellow:#f9a825; --orange:#ef6c00; --text:#fff;
      --center-top:30%;
      --glass-bg1:rgba(255,255,255,.35);
      --glass-bg2:rgba(255,255,255,.22);
      --glass-brd:rgba(255,255,255,.38);
      --bg-bright:1.12;
    }
    body{ margin:0; background:#0b0f14; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; color:#fff; }
    .stage{ min-height:100vh; display:grid; place-items:center; padding:16px; }
    .app{
      width:390px; height:780px; position:relative; overflow:hidden; border-radius:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25); background:#000;
    }
    @media (max-width:480px){ .app{ width:100vw; height:100vh; border-radius:0; box-shadow:none; } }

    .bg{ position:absolute; inset:0; background:#000 center/cover no-repeat;
         filter: brightness(var(--bg-bright)) contrast(1.05) saturate(1.06); }
    .scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.35)); }

    /* HUD topo */
    .hud{ position:absolute; left:12px; right:12px; top:12px; }
    .widgets{
      display:grid;
      /* ↑ chips um pouco mais largos */
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap:10px;
      width:100%;
    }
    .mini{
      /* ↑ mais espaço e altura */
      padding:12px 14px; border-radius:12px;
      min-height:60px;
      backdrop-filter:blur(8px);
      background:linear-gradient(135deg,var(--glass-bg1),var(--glass-bg2));
      border:1px solid var(--glass-brd);
      box-shadow:0 8px 22px rgba(0,0,0,.16);
      color:#0f1720;
      transition:all .18s ease;
    }
    .mini .t{ font-size:12px; font-weight:700; margin:0 0 2px; opacity:.95; }
    .mini .s{ font-size:12px; white-space:pre-line; color:#2d3a45; line-height:1.2; }

    /* Botão pequeno dentro do card */
    .mini .mini-btn{
      margin-top:6px; font-size:11px; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.78);
      color:#0f1720; cursor:pointer;
    }
    .mini .mini-btn:active{ transform:translateY(1px); }

    /* --- MODO COMPACTO (chip maiorzinho) --- */
    .mini.compact{
      padding:10px 14px;          /* ↑ antes 6px 10px */
      min-height:auto;
      display:flex; align-items:center; gap:10px; /* ↑ gap maior */
      border-radius:14px;         /* um pouco mais quadrado que a pílula */
      box-shadow:0 6px 18px rgba(0,0,0,.12);
    }
    .mini.compact .t{ display:none; }
    .mini.compact .s{
      display:flex; align-items:center; gap:8px;
      white-space:nowrap;
      font-size:13.5px;           /* ↑ fonte maior */
      line-height:1.25;
    }
    .mini.compact .s br{ display:none; }  /* esconde “em\nCarpina” no chip */
    .mini.compact .mini-btn{ display:none; }

    .pill-ico{ font-size:16px; } /* ↑ ícone maior */

    /* Texto central */
    .center{
      position:absolute; left:50%; top:var(--center-top); transform:translate(-50%,-50%);
      width:100%; display:flex; justify-content:center; padding:0 16px; pointer-events:none; z-index:3;
    }
    .river{ text-align:center; --shadow:0 2px 6px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.6); }
    .icon{ font-size:48px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .label{ margin-top:6px; font-size:14px; color:#e9f1fb; text-shadow:var(--shadow); letter-spacing:.2px; }
    .status{ margin-top:2px; font-size:24px; font-weight:900; text-shadow:var(--shadow); }
    .status.ok{ color:var(--ok); } .status.yellow{ color:var(--yellow); } .status.orange{ color:var(--orange); }
    .msg{ margin-top:6px; font-size:14px; color:#f0f6ff; opacity:.95; text-shadow:var(--shadow); }

    .bottom{ position:absolute; inset:auto 16px 14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; z-index:4; }
    .btn{ border:0; padding:10px 14px; border-radius:12px; background:#1565c0; color:#fff; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25);}
    .btn:active{ transform:translateY(1px); }
    .ts{ font-size:11px; color:#e7eef6; text-shadow:0 1px 2px rgba(0,0,0,.55); }
  </style>

<!-- === UI Overrides: blocos maiores, mais opacos e sem vazamento de texto === -->
<style>
:root{
  /* mais opaco para melhorar leitura */
  --glass-bg1: rgba(255,255,255,.55);
  --glass-bg2: rgba(255,255,255,.35);
  --glass-brd: rgba(255,255,255,.55);
}

/* grid de widgets um pouco maior */
.widgets{
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

/* cartões/blocos mais altos e legíveis */
.mini{
  padding: 14px 16px;
  min-height: 88px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--glass-bg1), var(--glass-bg2));
  border: 1px solid var(--glass-brd);
  backdrop-filter: blur(10px) saturate(140%);
}

/* impedir vazamento e permitir 2 linhas com reticências */
.mini .t, .mini .s{
  white-space: normal;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;         /* até 2 linhas */
  -webkit-box-orient: vertical;
}

.mini .t{ font-size: 13px; margin-bottom: 4px; }
.mini .s{ line-height: 1.25; }
</style>
</head>
<body>
  <div class="stage">
    <div class="app">
      <div class="bg" id="bg"></div>
      <div class="scrim"></div>

      <div class="hud">
        <div class="widgets">
          <!-- Chuva -->
          <div class="mini" id="cardRain">
            <div class="t">☔ Chuva nas últimas 24h</div>
            <div class="s">
              <span class="pill-ico">☔</span>
              <span><span id="rainVal">—</span> mm <br>em <strong id="muniName">carregando…</strong></span>
            </div>
            <button id="btnLocate" class="mini-btn">Usar minha localização</button>
          </div>
          <!-- Deslizamento -->
          <div class="mini" id="cardLand">
            <div class="t">⛰️ Risco de deslizamento</div>
            <div class="s" id="landText">Carregando…</div>
          </div>
        </div>
      </div>

      <div class="center">
        <div class="river" id="riverCard">
          <div class="icon" id="riverIcon">💧</div>
          <div class="label">Nível do rio</div>
          <div class="status ok" id="riverStatus">Normal</div>
          <div class="msg" id="riverMsg">Tudo tranquilo por enquanto.</div>
        </div>
      </div>

      <div class="bottom">
        <button class="btn" id="btnSwap">Forçar troca</button>
        <div class="ts" id="ts">Atualizado em: — • chips+</div>
      </div>
    </div>
  </div>

<script defer>
(function(){
  console.log('UI chips maiores');
  const TICK_SECONDS = 30;

  /* ======= APAC (camada de municípios) ======= */
  const MAP_BASE          = 'https://geoportal.apac.pe.gov.br/server/rest/services/met_volume_acumulado_chuva_24hs/MapServer';
  const LAYER_MUNICIPIOS  = 1;               // polígono com nm_mun + horas_24
  const FIELD_NAME        = 'nm_mun';
  const FIELD_MM24        = 'horas_24';
  const USE_PROXY         = true;            // se usa /api/apac-rain.js na Vercel
  const UPDATE_MIN        = 5;
  let   MUNICIPIO         = localStorage.getItem('apac_muni') || 'NAZARÉ DA MATA';

  /* ======= Fundo ======= */
  const bg = document.getElementById('bg');
  const BG_BASE = { none:'joana_normal', yellow:'joana_alerta_amarelo', orange:'joana_alerta_laranja' };
  const EXT = ['.jpg','.jpeg','.png',''];
  function resolveImage(base, cb){
    let i=0; const tryNext=()=>{ if(i>=EXT.length){ return cb(null); }
      const src=`${base}${EXT[i++]}?v=${Date.now()}`; const im=new Image();
      im.onload=()=>cb(src); im.onerror=tryNext; im.src=src; };
    tryNext();
  }
  function setBackground(level){ resolveImage(BG_BASE[level]||BG_BASE.none, (src)=>{ if(src) bg.style.backgroundImage=`url("${src}")`; }); }

  /* ======= UI refs ======= */
  const riverIcon = document.getElementById('riverIcon');
  const riverStatus = document.getElementById('riverStatus');
  const riverMsg = document.getElementById('riverMsg');
  const rainVal = document.getElementById('rainVal');
  const muniNameEl = document.getElementById('muniName');
  const landText = document.getElementById('landText');
  const ts = document.getElementById('ts');
  const btnSwap = document.getElementById('btnSwap');
  const btnLocate = document.getElementById('btnLocate');
  const cardRain = document.getElementById('cardRain');
  const cardLand = document.getElementById('cardLand');

  let state = { river_level:'none', rain_mm_24h:NaN, landslide_risk:'none', ts:new Date() };

  function setState(s){
    state = s;
    setBackground(state.river_level);

    const map = {
      none:{icon:'💧',label:'Normal',cls:'ok',msg:'Tudo tranquilo por enquanto.'},
      yellow:{icon:'⚠️',label:'ALERTA AMARELO',cls:'yellow',msg:'Atenção! Nível elevado. Fique em alerta.'},
      orange:{icon:'⚠️',label:'ALERTA LARANJA',cls:'orange',msg:'Risco moderado/alto. Evite áreas sujeitas a alagamento.'}
    };
    const m = map[state.river_level]||map.none;

    riverIcon.textContent = m.icon;
    riverStatus.className = 'status ' + m.cls;
    riverStatus.textContent = m.label;
    riverMsg.textContent = m.msg;

    if (!Number.isNaN(state.rain_mm_24h)) {
      rainVal.textContent = Number(state.rain_mm_24h).toFixed(1);
    }
    landText.textContent = {
      none:'⛰️ Nenhum',
      yellow:'⚠️ AMARELO — monitore encostas.',
      orange:'⛔ LARANJA — evite áreas de risco.'
    }[state.landslide_risk] || '⛰️ Nenhum';

    // Compacta automaticamente (agora com chip maior):
    cardRain.classList.toggle('compact', Number(state.rain_mm_24h) < 1);
    cardLand.classList.toggle('compact', state.landslide_risk === 'none');

    ts.textContent = 'Atualizado em: ' + new Date(state.ts).toLocaleString('pt-BR');
  }

  const levels=['none','yellow','orange'];
  const nextLevel = l => levels[(levels.indexOf(l)+1)%levels.length];
  function randomSim(){
    const next = nextLevel(state.river_level);
    setState({ river_level:next, rain_mm_24h:state.rain_mm_24h, landslide_risk:state.landslide_risk, ts:new Date() });
  }

  /* ======= ArcGIS ======= */
  async function fetchArcGIS(layer, params){
    const base = USE_PROXY
      ? `/api/apac-rain?service=${encodeURIComponent(`${MAP_BASE}/${layer}`)}&`
      : `${MAP_BASE}/${layer}/query?`;
    const url = base + params.toString();
    const r = await fetch(url);
    if(!r.ok) throw new Error('APAC HTTP '+r.status);
    return r.json();
  }

  async function getMunicipioByPoint(lat, lon){
    const geometry = JSON.stringify({ x: lon, y: lat, spatialReference:{ wkid:4326 } });
    const params = new URLSearchParams({
      geometry, geometryType:'esriGeometryPoint', inSR:'4326',
      spatialRel:'esriSpatialRelIntersects', distance:'3', units:'Kilometers',
      outFields: `${FIELD_NAME}`, returnGeometry:'false',
      f:'json', resultRecordCount:'1'
    });
    const data = await fetchArcGIS(LAYER_MUNICIPIOS, params);
    if(data.features && data.features.length){
      const a = data.features[0].attributes || {};
      return (a[FIELD_NAME] || '').toString().trim();
    }
    throw new Error('Ponto fora do limite municipal');
  }

  async function getRainForMunicipio(muni){
    const where = `UPPER(${FIELD_NAME})='${muni.toUpperCase()}'`;
    const params = new URLSearchParams({
      where, outFields:`${FIELD_MM24},${FIELD_NAME},ultima_leitura_data_hora`,
      returnGeometry:'false', resultRecordCount:'1', f:'json'
    });
    const data = await fetchArcGIS(LAYER_MUNICIPIOS, params);
    if(data.features && data.features.length){
      const a = data.features[0].attributes || {};
      return { muni: a[FIELD_NAME] || muni, mm24: Number(a[FIELD_MM24] ?? 0), ts: a.ultima_leitura_data_hora || new Date() };
    }
    throw new Error('Município não encontrado no layer 1');
  }

  async function atualizarChuva(){
    try{
      const { muni, mm24, ts:tsRow } = await getRainForMunicipio(MUNICIPIO);
      MUNICIPIO = muni;
      localStorage.setItem('apac_muni', muni);
      muniNameEl.textContent = muni;

      let land = 'none';
      if (mm24 > 120) land = 'orange';
      else if (mm24 > 80) land = 'yellow';

      setState({ river_level: state.river_level, rain_mm_24h: mm24, landslide_risk: land, ts: tsRow });
    }catch(e){ console.warn('[APAC]', e); }
  }

  const CAN_GEO = (location.protocol === 'https:' || location.hostname === 'localhost');
  async function geolocateAndSetMunicipio(){
    if(!CAN_GEO || !('geolocation' in navigator)) return;
    try{
      btnLocate.textContent = 'Localizando…'; btnLocate.disabled = true;
      const pos = await new Promise((res,rej)=>{
        navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy:false, maximumAge:600000, timeout:12000 });
      });
      const { latitude, longitude } = pos.coords;
      const muni = await getMunicipioByPoint(latitude, longitude);
      if (muni){
        MUNICIPIO = muni; muniNameEl.textContent = muni;
        localStorage.setItem('apac_muni', muni);
        await atualizarChuva();
        btnLocate.style.display='none';
      } else {
        btnLocate.textContent = 'Tentar novamente'; btnLocate.disabled=false;
      }
    }catch(e){
      console.warn('Geo falhou/negada:', e);
      btnLocate.textContent = (e && e.code === 1) ? 'Permitir localização nas configurações' : 'Tentar novamente';
      btnLocate.disabled = false;
    }
  }

  /* ======= Inicial ======= */
  muniNameEl.textContent = MUNICIPIO;
  setState(state);
  atualizarChuva();
  if (CAN_GEO) btnLocate.addEventListener('click', geolocateAndSetMunicipio);
  // === Geo: melhorar UX no Vercel ===
  // 1) Sempre tente associar o clique (mesmo sem HTTPS) para o caso de embed/iframe corrigido
  btnLocate.addEventListener('click', geolocateAndSetMunicipio);

  // 2) Em contexto seguro, tentamos acionar automaticamente uma vez para disparar o prompt
  if (CAN_GEO && window.top === window.self) {
    if ('permissions' in navigator && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then(perm => {
        if (perm.state === 'granted') {
          geolocateAndSetMunicipio();
        } else if (perm.state === 'prompt') {
          setTimeout(() => geolocateAndSetMunicipio(), 400);
        } else if (perm.state === 'denied') {
          btnLocate.textContent = 'Permitir localização nas configurações';
        }
        perm.onchange = () => { if (perm.state === 'granted') geolocateAndSetMunicipio(); };
      }).catch(() => {
        setTimeout(() => geolocateAndSetMunicipio(), 400);
      });
    } else {
      setTimeout(() => geolocateAndSetMunicipio(), 400);
    }
  } else if (window.top !== window.self) {
    // Se estiver embutido em iframe, precisa de allow="geolocation" no iframe
    btnLocate.title = 'Se estiver em outro site, o iframe precisa de allow="geolocation"';
  }


  setInterval(atualizarChuva, UPDATE_MIN*60*1000);   // refresh periódico
  randomSim(); setInterval(randomSim, TICK_SECONDS*1000);
  btnSwap.addEventListener('click', randomSim);
})();
</script>

<!-- Bloco do ultrassônico (adicionei antes do </body>) -->
<div id="ultra-box" style="margin:8px 0; font-weight:600;">
  Distância da água: <span id="ultra-val">—</span>
</div>

<script>
(() => {
  async function loadUltrassom() {
    try {
      const r = await fetch('/api/telemetria', { cache: 'no-store' });
      const data = await r.json();
      const dev = data?.['heltec-01'] || (Object.values(data || {})[0] || null);
      if (dev?.data?.distance_cm != null) {
        document.getElementById('ultra-val').textContent =
          dev.data.distance_cm.toFixed(1) + ' cm';
      } else {
        document.getElementById('ultra-val').textContent = '—';
      }
    } catch (e) {
      document.getElementById('ultra-val').textContent = 'Erro';
    }
  }
  loadUltrassom();
  setInterval(loadUltrassom, 3000);
})();
</script>
</body>
</html>
