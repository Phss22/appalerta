<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>AquaSense — Alerta do Rio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root{
      --ok:#2e7d32; --yellow:#f9a825; --orange:#ef6c00; --text:#fff;
      --center-top:38%;
      --glass-bg1:rgba(255,255,255,.55);
      --glass-bg2:rgba(255,255,255,.35);
      --glass-brd:rgba(255,255,255,.55);
      --bg-bright:1.12;
      --muted:#b7c3cf; --ink:#0a0f14;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; background:#0b0f14; color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      -webkit-text-size-adjust:100%;
    }
    .stage{
      min-height:100dvh; display:grid; place-items:center;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)) 12px;
    }
    .app{
      position:relative; overflow:hidden; background:#000;
      width:100vw; height:100dvh; border-radius:0; box-shadow:none; touch-action:manipulation;
    }
    @media (min-width: 481px){
      .app{
        width:390px; height:780px; border-radius:28px;
        box-shadow:0 20px 60px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25);
      }
    }

    .bg{ position:absolute; inset:0; background:#000 center/cover no-repeat;
         filter: brightness(var(--bg-bright)) contrast(1.05) saturate(1.06);
         opacity:0; transform:scale(1.02);
         transition: opacity .6s ease, transform 6s ease; }
    .bg.active{ opacity:1; transform:scale(1.0); }
    .scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.35)); }

    .hud{ position:absolute; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); }
    .widgets{ display:grid; gap:12px; width:100%; grid-template-columns:1fr; }

    .mini{
      padding:14px 16px; border-radius:16px; min-height:96px;
      backdrop-filter:blur(10px) saturate(140%);
      background:linear-gradient(135deg,var(--glass-bg1),var(--glass-bg2));
      border:1px solid var(--glass-brd); box-shadow:0 8px 22px rgba(0,0,0,.16);
      color:#0f1720; transition:box-shadow .25s, background .25s, border-color .25s, transform .25s;
    }
    .mini .t{
      font-size:13px; font-weight:700; margin:0 0 4px; opacity:.95;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere;
    }
    .mini .s{
      line-height:1.25; color:#2d3a45;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere;
      margin-bottom:2px;
    }
    .mini.alert{ border-color: rgba(239,108,0,.55); box-shadow:0 10px 24px rgba(239,108,0,.18); }
    .mini.warn { border-color: rgba(249,168,37,.55); box-shadow:0 10px 24px rgba(249,168,37,.18); }
    .mini.ok   { border-color: rgba(46,125,50,.35);  box-shadow:0 10px 24px rgba(46,125,50,.14); }

    /* card de deslizamento mais compacto pra não brigar com o emoji */
    #cardLand{ padding:10px 12px; min-height:auto; }
    #cardLand .t{ margin-bottom:2px; }
    #cardLand .s{ font-size:13px; }

    .center{
      position:absolute; left:50%; top:var(--center-top); transform:translate(-50%,-50%);
      width:100%; display:flex; justify-content:center; padding:0 16px; pointer-events:none; z-index:3;
    }
    .river{ text-align:center; --shadow:0 2px 6px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.6); }
    .icon{ font-size:48px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); transition:transform .45s ease; }
    .label{ margin-top:6px; font-size:14px; color:#e9f1fb; text-shadow:var(--shadow); letter-spacing:.2px; }
    .status{ margin-top:2px; font-size:24px; font-weight:900; text-shadow:var(--shadow); transition: color .35s ease, transform .35s ease, opacity .35s ease; }
    .status.ok{ color:var(--ok); } .status.yellow{ color:#f9a825; } .status.orange{ color:#ef6c00; }
    .status.pop{ animation:pop .45s ease; }
    @keyframes pop{ 0%{ transform:translateY(6px) scale(.98); opacity:.6 } 100%{ transform:none; opacity:1 } }
    .msg{ margin-top:6px; font-size:14px; color:#f0f6ff; opacity:.95; text-shadow:var(--shadow); }

    .bottom{
      position:absolute; left:12px; right:12px;
      bottom:calc(10px + env(safe-area-inset-bottom));
      display:flex; align-items:center; gap:10px; z-index:4; flex-wrap:wrap;
    }
    .bottom .mid{ flex:1 1 auto; min-width:160px; }
    .btn{ border:0; padding:10px 14px; border-radius:12px; background:#1565c0; color:#fff; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25); }
    .btn-share-bottom{ background:#25D366; }
    .btn-refresh{ background:#1976d2; }
    .ts{ font-size:11px; color:#e7eef6; white-space:nowrap; }
    #recencia{ font-size:11px; color:#e7eef6; opacity:.9; margin-left:6px; white-space:nowrap; }

    details.spark{ margin:8px 0 0; }
    details.spark > summary{ cursor:pointer; list-style:none; color:var(--ink); font-size:12px; background:rgba(255,255,255,.96); border:1px solid var(--glass-brd); display:inline-block; padding:6px 8px; border-radius:10px; user-select:none; }
    details.spark > summary::-webkit-details-marker{ display:none; }
    .sparkwrap{ margin-top:6px; padding:6px; background:rgba(255,255,255,.96); border:1px solid var(--glass-brd); border-radius:10px; color:#0f1720; }
    #sparkLabel{ font-size:11px; color:#0f1720; margin-top:4px; }

    /* bloco de distância fica sempre acima da barra inferior */
    #ultra-box{
      position:absolute; left:12px; right:12px;
      text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.5); z-index:3;
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="app" id="appRoot">
      <div class="bg" id="bgA"></div>
      <div class="bg" id="bgB"></div>
      <div class="scrim"></div>

      <div class="hud">
        <div class="widgets">
          <div class="mini ok" id="cardRain">
            <div class="t">☔ Chuva nas últimas 24h</div>
            <div class="s">
              <span class="pill-ico">☔</span>
              <span><span id="rainVal">—</span> mm <br>em <strong id="muniName">Nazaré da Mata</strong></span>
            </div>

            <details class="spark" id="sparkDetails" style="display:none;">
              <summary>📈 Ver tendência (leituras recentes)</summary>
              <div class="sparkwrap" id="sparkWrap">
                <svg id="spark" width="100%" height="28" viewBox="0 0 180 28" preserveAspectRatio="none"></svg>
                <div id="sparkLabel">—</div>
              </div>
            </details>
          </div>

          <div class="mini ok" id="cardLand">
            <div class="t">⛰️ Risco de deslizamento</div>
            <div class="s" id="landText" aria-live="polite">Carregando…</div>
          </div>
        </div>
      </div>

      <div class="center">
        <div class="river" id="riverCard" aria-live="polite">
          <div class="icon" id="riverIcon">💧</div>
          <div class="label">Nível do rio</div>
          <div class="status ok" id="riverStatus">Normal</div>
          <div class="msg" id="riverMsg">Tudo tranquilo por enquanto.</div>
        </div>
      </div>
      
      <div id="ultra-box">
        <div style="font-size:14px; font-weight:600;">
          Distância da água: <span id="ultra-val" style="font-size:18px;">—</span> 
          <span id="ultra-age" class="muted" style="font-size:11px;"></span>
          <span id="ultra-timer" class="muted" style="font-size:11px; margin-left:4px;"></span>
        </div>
      </div>

      <div class="bottom" id="bottomBar">
        <div class="mid"><div class="ts" id="ts">Atualizado em: — <span id="recencia"></span></div></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-refresh" id="btnRefresh" aria-label="Forçar atualização (demo)">Atualizar</button>
          <button class="btn btn-share-bottom" id="btnShare" aria-label="Compartilhar no WhatsApp">Compartilhar</button>
        </div>
      </div>
    </div>
  </div>

<script defer>
(function(){
  // ===== Config =====
  const MAP_BASE='https://geoportal.apac.pe.gov.br/server/rest/services/met_volume_acumulado_chuva_24hs/MapServer';
  const LAYER_MUNICIPIOS=1, FIELD_NAME='nm_mun', FIELD_MM24='horas_24';
  const USE_PROXY=true;
  const UPDATE_MIN_RAIN=5;
  const POLL_TELEM_SEC=5;
  const EXPECT_TELEM_PERIOD_SEC=15;
  const FIXED_MUNI='NAZARÉ DA MATA';

  // ===== Limiares (cm) — <=3 LARANJA, >3–6 AMARELO, >6 NORMAL =====
  const LIMITS = { orangeMax: 3, yellowMax: 6 };
  function levelFromDistance(d){
    if (d <= LIMITS.orangeMax) return 'orange';
    if (d <= LIMITS.yellowMax) return 'yellow';
    return 'none';
  }

  // ===== DOM =====
  const appRoot=document.getElementById('appRoot'), hudEl=document.querySelector('.hud'), bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB');
  const riverIcon=document.getElementById('riverIcon'), riverStatus=document.getElementById('riverStatus'), riverMsg=document.getElementById('riverMsg');
  const rainVal=document.getElementById('rainVal'), muniNameEl=document.getElementById('muniName'), landText=document.getElementById('landText');
  const ts=document.getElementById('ts'), recencia=document.getElementById('recencia');
  const btnShare=document.getElementById('btnShare'), cardRain=document.getElementById('cardRain'), cardLand=document.getElementById('cardLand');
  const spark=document.getElementById('spark'), sparkLabel=document.getElementById('sparkLabel'), sparkDetails=document.getElementById('sparkDetails');
  const ultraVal=document.getElementById('ultra-val'), ultraAge=document.getElementById('ultra-age'), ultraTimer=document.getElementById('ultra-timer');
  const btnRefresh=document.getElementById('btnRefresh');
  const bottomBar=document.getElementById('bottomBar');

  // ===== Estado =====
  let MUNICIPIO=FIXED_MUNI;
  let state={river_level:'none', rain_mm_24h:NaN, landslide_risk:'none', ts:Date.now()};
  let prevRiverLevel=state.river_level, activeBg='A';
  let lastTelemTs=null;

  // ===== Utils =====
  const norm=s=> (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  const escQ=s=> (s||'').replace(/'/g,"''");
  function fromNow(tsVal){const t=(typeof tsVal==='number')?tsVal:new Date(tsVal).getTime();const s=Math.max(0,(Date.now()-t)/1000|0);if(s<60)return`${s}s`;const m=(s/60|0);if(m<60)return`${m} min`;const h=(m/60|0);return`${h} h`;}
  function setRecencia(tsVal){ recencia.textContent='• há '+fromNow(tsVal); }

  // ===== posiciona ultra-box acima da barra inferior =====
  function placeUltraBox(){
    const bottomH = bottomBar.getBoundingClientRect().height || 56;
    document.getElementById('ultra-box').style.bottom = (bottomH + 8) + 'px';
  }
  window.addEventListener('resize', placeUltraBox);

  // ===== Render =====
  function renderUI(){
    setBackground(state.river_level);
    setCardEmphasis();
    const map={ none:{icon:'💧',label:'Normal',cls:'ok',msg:'Tudo tranquilo por enquanto.'},
                yellow:{icon:'⚠️',label:'ALERTA AMARELO',cls:'yellow',msg:'Atenção! Nível do rio subindo.'},
                orange:{icon:'⚠️',label:'ALERTA LARANJA',cls:'orange',msg:'Risco de inundação. Evite áreas de risco.'} };
    const m=map[state.river_level]||map.none;
    if(prevRiverLevel!==state.river_level){ riverIcon.style.transform='scale(1.08)'; setTimeout(()=>riverIcon.style.transform='',350);
      riverStatus.classList.remove('pop'); void riverStatus.offsetWidth; riverStatus.classList.add('pop'); }
    prevRiverLevel=state.river_level;
    riverIcon.textContent=m.icon; riverStatus.className='status '+m.cls; riverStatus.textContent=m.label; riverMsg.textContent=m.msg;
    if(!Number.isNaN(state.rain_mm_24h)) rainVal.textContent=Number(state.rain_mm_24h).toFixed(1);
    landText.textContent={none:'⛰️ Nenhum',yellow:'⚠️ AMARELO — monitore encostas.',orange:'⛔ LARANJA — evite áreas de risco.'}[state.landslide_risk]||'⛰️ Nenhum';
    cardRain.classList.toggle('compact', Number(state.rain_mm_24h)<1);
    cardLand.classList.toggle('compact', state.landslide_risk==='none');
    const tsNum=Number(new Date(state.ts))||Date.now();
    ts.firstChild.nodeValue='Atualizado em: '+new Date(tsNum).toLocaleString('pt-BR')+' ';
    setRecencia(tsNum);
    placeUltraBox();
  }
  function setCardEmphasis(){ cardRain.className='mini'; cardLand.className='mini';
    if(state.landslide_risk==='orange'){ cardLand.classList.add('alert'); cardRain.classList.add('warn'); }
    else if(state.landslide_risk==='yellow'){ cardLand.classList.add('warn'); cardRain.classList.add('ok'); }
    else { cardLand.classList.add('ok'); cardRain.classList.add('ok'); } }

  const BG_BASE={none:'joana_normal',yellow:'joana_alerta_amarelo',orange:'joana_alerta_laranja'};
  const EXT=['.jpg','.jpeg','.png',''];
  function resolveImage(base,cb){let i=0;const t=()=>{if(i>=EXT.length)return cb(null);const src=`${base}${EXT[i++]}?v=${Date.now()}`;const im=new Image();im.onload=()=>cb(src);im.onerror=t;im.src=src;};t();}
  function setBackground(level){const base=BG_BASE[level]||BG_BASE.none; resolveImage(base,(src)=>{if(!src)return; const next=activeBg==='A'?bgB:bgA, prev=activeBg==='A'?bgA:bgB; next.style.backgroundImage=`url("${src}")`; next.classList.add('active'); prev.classList.remove('active'); activeBg=(activeBg==='A')?'B':'A';});}

  // ===== Chuva (real) =====
  async function atualizarChuva(){
    try{
      const {muni,mm24,ts:tsRow}=await getRainForMunicipio(FIXED_MUNI);
      MUNICIPIO=muni; muniNameEl.textContent=muni;
      let land='none'; if(mm24>20) land='orange'; else if(mm24>10) land='yellow';
      state.rain_mm_24h=mm24; state.landslide_risk=land; state.ts=tsRow||Date.now();
      renderUI(); updateHistoryAndSpark();
    }catch(e){ console.warn('[APAC]',e); }
  }

  async function getRainForMunicipio(muniRaw){
    const muniUpper = (muniRaw||'').toString().trim().toUpperCase();
    const muniNorm  = norm(muniRaw);
    let where = `UPPER(${FIELD_NAME})='${escQ(muniUpper)}'`;
    let params = new URLSearchParams({ where, outFields:`${FIELD_MM24},${FIELD_NAME},ultima_leitura_data_hora`, returnGeometry:'false', f:'json', resultRecordCount:'1' });
    let data = await fetchArcGIS(LAYER_MUNICIPIOS, params);
    if(!data.features?.length){
      where = `UPPER(${FIELD_NAME})='${escQ(muniNorm)}'`;
      params = new URLSearchParams({ where, outFields:`${FIELD_MM24},${FIELD_NAME},ultima_leitura_data_hora`, returnGeometry:'false', f:'json', resultRecordCount:'1' });
      data = await fetchArcGIS(LAYER_MUNICIPIOS, params);
    }
    if(!data.features?.length){
      const firstAcc = escQ(muniUpper.split(/\s+/)[0]);
      where = `UPPER(${FIELD_NAME}) LIKE '${firstAcc}%'`;
      params = new URLSearchParams({ where, outFields:`${FIELD_MM24},${FIELD_NAME},ultima_leitura_data_hora`, returnGeometry:'false', f:'json', resultRecordCount:'1' });
      data = await fetchArcGIS(LAYER_MUNICIPIOS, params);
    }
    if(!data.features?.length){
      const firstNo = escQ(muniNorm.split(/\s+/)[0]);
      where = `UPPER(${FIELD_NAME}) LIKE '${firstNo}%'`;
      params = new URLSearchParams({ where, outFields:`${FIELD_MM24},${FIELD_NAME},ultima_leitura_data_hora`, returnGeometry:'false', f:'json', resultRecordCount:'1' });
      data = await fetchArcGIS(LAYER_MUNICIPIOS, params);
    }
    if(data.features?.length){
      const a = data.features[0].attributes || {};
      return { muni: a[FIELD_NAME] || muniRaw, mm24: Number(a[FIELD_MM24] ?? 0), ts: a.ultima_leitura_data_hora || Date.now() };
    }
    throw new Error('Município não encontrado');
  }

  async function fetchArcGIS(layer,params){
    const base=USE_PROXY?`/api/apac-rain?service=${encodeURIComponent(`${MAP_BASE}/${layer}`)}&`:`${MAP_BASE}/${layer}/query?`;
    const r=await fetch(base+params.toString(),{mode:'cors',cache:'no-store'});
    if(!r.ok) throw new Error('APAC HTTP '+r.status);
    return r.json();
  }

  // ===== Telemetria (real) =====
  async function loadUltrassom(){
    try{
      const r=await fetch('/api/telemetria',{cache:'no-store'}); 
      const data=await r.json();
      const dev=data?.['heltec-01'] || (Object.values(data||{})[0]||null);
      const raw = (dev && dev.data) ? (dev.data.distance_cm ?? dev.data.data?.distance_cm) : null;

      if(raw != null){ 
        const distance=Number(raw);
        ultraVal.textContent=distance.toFixed(1)+' cm'; 
        const tsMs = dev?.received_at ?? (dev?.data?.ts ? (dev.data.ts*1000) : null);
        if(tsMs){ ultraAge.textContent='• há '+fromNow(tsMs); lastTelemTs=tsMs; }
        state.river_level = levelFromDistance(distance);
        renderUI();
      } else {
        ultraVal.textContent='—'; ultraAge.textContent='';
      }
    } catch(e){
      console.warn('[Telemetria]',e);
      ultraVal.textContent='—'; ultraAge.textContent='';
    }
  }

  // contador “próxima em …s”
  setInterval(()=>{
    if(!lastTelemTs){ ultraTimer.textContent='(aguardando leitura...)'; return; }
    const elapsed=((Date.now()-lastTelemTs)/1000)|0;
    const left=Math.max(0, EXPECT_TELEM_PERIOD_SEC - (elapsed % EXPECT_TELEM_PERIOD_SEC));
    ultraTimer.textContent = left===0 ? '(atualizando...)' : `(próxima em ${left}s)`;
  },1000);

  // ===== Histórico (spark) =====
  function updateHistoryAndSpark(){ addHistoryPoint(MUNICIPIO, state.rain_mm_24h); drawSpark(MUNICIPIO); }
  function histKey(m){return 'aqs_hist_'+norm(m)}
  function addHistoryPoint(m,v){const k=histKey(m);let a=[];try{a=JSON.parse(localStorage.getItem(k)||'[]')}catch{} a.push({t:Date.now(),v:Number(v)||0}); if(a.length>32)a=a.slice(a.length-32); localStorage.setItem(k,JSON.stringify(a));}
  function getHistory(m){try{return JSON.parse(localStorage.getItem(histKey(m))||'[]')}catch{return []}}
  function drawSpark(m){
    let a=getHistory(m);
    if(a.length<2){sparkDetails.open=false; sparkDetails.style.display='none'; placeUltraBox(); return;}
    sparkDetails.style.display='';
    const N=Math.min(a.length,32);
    a=a.slice(a.length-N);
    const H=28,PAD=2,max=Math.max(...a.map(p=>p.v),1);
    const pts=a.map((p,i)=>`${i*(180/(N-1))},${H-(p.v/max)*(H-2*PAD)-PAD}`).join(' ');
    spark.setAttribute('viewBox','0 0 180 28');
    spark.innerHTML=`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2"></polyline>`;
    const last=a[a.length-1];
    sparkLabel.textContent=`Últimas ${N} leituras • pico ${max.toFixed(1)} mm • atual ${last.v.toFixed(1)} mm`;
  }

  // ===== DEMO: botão Atualizar (gera distância compatível com os limites) =====
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function demoDistanceFor(level){
    if(level==='none')   return rand(LIMITS.yellowMax+0.1, LIMITS.yellowMax+6); // >6 cm
    if(level==='yellow') return rand(LIMITS.orangeMax, LIMITS.yellowMax);       // 3–6 cm (inclui 3)
    return rand(1.0, LIMITS.orangeMax - 0.05);                                  // <3 cm
  }

  function simulateOnce(){
    const level = pick(['none','yellow','orange']);
    const distance = demoDistanceFor(level);

    const mm24 = Math.max(0, +(rand(0,35)).toFixed(1));
    let land='none'; if(mm24>20) land='orange'; else if(mm24>10) land='yellow';

    state.river_level=level;
    state.rain_mm_24h=mm24;
    state.landslide_risk=land;
    state.ts=Date.now();
    lastTelemTs=Date.now();

    ultraVal.textContent=distance.toFixed(1)+' cm';
    ultraAge.textContent='• há 0s';
    muniNameEl.textContent='Nazaré da Mata';

    addHistoryPoint(MUNICIPIO, mm24);
    renderUI();
    drawSpark(MUNICIPIO);
  }

  btnRefresh.addEventListener('click', ()=>{
    const orig=btnRefresh.textContent;
    btnRefresh.disabled=true; btnRefresh.textContent='Simulando…';
    simulateOnce();
    setTimeout(()=>{ btnRefresh.disabled=false; btnRefresh.textContent=orig; }, 350);
  });

  // ===== Share =====
  function riskShareText(code){ if(code==='orange')return 'ALARANJADO — evite áreas de risco'; if(code==='yellow')return 'AMARELO — atenção'; return 'Nenhum'; }
  btnShare.addEventListener('click', ()=>{
    const cidade=muniNameEl.textContent.trim(), chuva=rainVal.textContent.trim(), nivel=riverStatus.textContent.trim(), risco=riskShareText(state.landslide_risk);
    const dist=document.getElementById('ultra-val')?.textContent?.trim();
    const tsTxt=ts.textContent.replace('Atualizado em:','').trim();
    let base=`AquaSense • ${cidade}\nChuva (24h): ${chuva} mm\nRisco de deslizamento: ${risco}\nNível do rio: ${nivel}`;
    if(dist && dist!=='—' && !/Erro/i.test(dist)) base+=`\nDistância da água: ${dist}`;
    base+=`\n${tsTxt}\nAcesse: aquasenseipa.vercel.app`;
    location.href='https://wa.me/?text='+encodeURIComponent(base);
  });

  // ===== Init =====
  bgA.classList.add('active');
  muniNameEl.textContent='Nazaré da Mata';
  renderUI();
  atualizarChuva();
  loadUltrassom();
  placeUltraBox();
  setInterval(atualizarChuva, UPDATE_MIN_RAIN*60*1000);
  setInterval(loadUltrassom, POLL_TELEM_SEC*1000);
})();
</script>

</body>
</html>
